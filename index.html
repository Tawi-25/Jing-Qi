<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qi · Exercise Guide</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0e13;
      color: #e4e0e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    .exercise-card {
      background: rgba(30, 27, 45, 0.8);
      border: 1px solid rgba(212, 163, 115, 0.2);
      border-radius: 1rem;
      padding: 2rem;
      max-width: 420px;
      width: 100%;
    }
    .exercise-image {
      width: 100%;
      height: auto;
      max-width: 300px;
      margin: 0 auto 1.5rem;
      display: block;
    }
    .exercise-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #d4a373;
      margin-bottom: 0.5rem;
    }
    .exercise-meta {
      font-size: 0.85rem;
      color: #9ca3af;
    }
    .attribution {
      margin-top: 2rem;
      font-size: 0.7rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="exercise-card">
    <img id="exercise-image" class="exercise-image" src="" alt="Exercise demonstration" />
    <div id="exercise-title" class="exercise-title">Loading...</div>
    <div id="exercise-meta" class="exercise-meta"></div>
  </div>
  <div class="attribution">
    Exercise illustrations by Bryl Lim / Everkinetic, licensed under CC BY-SA 4.0.
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
